# Render Blueprint for Vulcan
# Deploy from GitHub: https://render.com/docs/blueprint-spec

services:
  # Frontend
  - type: web
    name: vulcan-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: vulcan-backend
          envVarKey: RENDER_EXTERNAL_URL

  # Backend
  - type: web
    name: vulcan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vulcan-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai

databases:
  - name: vulcan-db
    plan: starter
