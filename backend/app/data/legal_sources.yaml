  - slug: courtlistener
    name: CourtListener
    category: courts_caselaw
    jurisdiction: us
    access: [mcp, web, api, bulk]
    cost: free_tier
    auth: oauth
    homepage: https://www.courtlistener.com
    api_base: https://www.courtlistener.com/api/rest/v4
    mcp_endpoint: https://mcp.courtlistener.com
    description: >-
      Start here. Roughly eight million opinions covering SCOTUS, all federal
      circuit and district courts, every state supreme and appellate court and
      a growing pool of state trial courts; over nine million decisions from
      more than 2,000 courts; the RECAP Archive of federal filings; 3.4M+
      minutes of oral argument; data on 16,191 judges; and financial
      disclosures. Semantic search was added to the search API in Nov 2025.
    tags: [caselaw, dockets, judges, recap, primary]
    implemented: true
    client: CourtListenerClient
    rate_limits: >-
      As of May 2026 higher rate limits sit behind membership tiers; a free
      account gets 5 requests/minute, 50/hour and 125/day. Student and
      academic memberships are free and raise those limits. Verify current
      terms at the source.
    notes: >-
      Every document already in the RECAP Archive is free permanently with no
      account required — where PACER charges $0.10/page, CourtListener charges
      nothing. Check RECAP before paying PACER.

