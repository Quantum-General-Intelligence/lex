# Legal & Mortgage Research Stack — source registry
#
# Free, public, and no-demo-funnel legal data sources.
#
# Inclusion rule: every entry is free, has a real free tier, or can be
# subscribed to online with a credit card. Nothing here requires "book a demo"
# or "contact sales" — anything gated that way is recorded under `excluded`
# with the reason, so the decision is not silently re-litigated later.
#
# Compiled: 2026-07-31
#
# Field reference
#   slug        stable identifier; never reuse or rename without a migration
#   access      mcp | api | web | bulk  (what surfaces the source exposes)
#   cost        free | free_tier | paid
#   auth        none | api_key | oauth | account
#   jurisdiction  federal | us | CA | TX | ... | international
#   tags        free-form; used for filtering (mortgage, foreclosure, ...)
#
# `web`-only sources are catalogued deliberately: several of the highest-value
# records in a foreclosure matter (county recorder instruments, DRE and NMLS
# licence status) have no API at all, and omitting them would misrepresent the
# research surface as more automatable than it is.

version: 1
compiled: "2026-07-31"

sources:
