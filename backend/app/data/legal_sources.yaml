  # 1. General mortgage law — federal
  # ─────────────────────────────────────────────────────────────────────
  - slug: cornell-lii
    name: Cornell Legal Information Institute (LII)
    category: federal_law
    jurisdiction: federal
    access: [web, api]
    cost: free
    auth: none
    homepage: https://www.law.cornell.edu
    description: >-
      Full text of the U.S. Code and Code of Federal Regulations with
      cross-linked annotations. The fastest way to read a federal statute
      properly. Run by Cornell Law School; no account, no limits.
    tags: [statutes, regulations, mortgage, reference]
    key_citations:
      - "15 U.S.C. § 1601 et seq. (TILA)"
      - "12 U.S.C. § 2601 et seq. (RESPA)"
      - "12 C.F.R. Part 1024 (Reg X)"
      - "12 C.F.R. Part 1026 (Reg Z)"

