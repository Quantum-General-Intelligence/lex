# ─────────────────────────────────────────────────────────────────────────
# State foreclosure process
#
# Foreclosure is state law and the differences are large. The single most
# important distinction is judicial vs. nonjudicial.
# ─────────────────────────────────────────────────────────────────────────
state_foreclosure:
  - state: CA
    name: California
    process: nonjudicial
    statutes_url: https://leginfo.legislature.ca.gov
    notes: ~4 months minimum; strong anti-deficiency protection.
  - state: TX
    name: Texas
    process: nonjudicial
    statutes_url: https://statutes.capitol.texas.gov
    notes: Very fast — 21-day notice, first-Tuesday sales.
  - state: NY
    name: New York
    process: judicial
    statutes_url: https://www.nysenate.gov/legislation
    notes: Slow; mandatory settlement conferences.
  - state: FL
    name: Florida
    process: judicial
    statutes_url: http://www.leg.state.fl.us/statutes
    notes: Chapter 702; contested cases run long.
  - state: IL
    name: Illinois
    process: judicial
    statutes_url: https://www.ilga.gov/legislation/ilcs
    notes: Statutory redemption period.
  - state: AZ
    name: Arizona
    process: nonjudicial
    statutes_url: https://www.azleg.gov/arstitle
    notes: ~90 days; deed of trust state.
  - state: NV
    name: Nevada
    process: nonjudicial
    statutes_url: https://www.leg.state.nv.us/nrs
    notes: Mediation program for residential.
  - state: WA
    name: Washington
    process: nonjudicial
    statutes_url: https://app.leg.wa.gov/rcw
    notes: ~120 days.
  - state: GA
    name: Georgia
    process: nonjudicial
    statutes_url: https://www.legis.ga.gov
    notes: Very fast; advertise 4 weeks.
  - state: MA
    name: Massachusetts
    process: nonjudicial
    statutes_url: https://malegislature.gov/laws
    notes: Strict notice compliance.
  - state: NJ
    name: New Jersey
    process: judicial
    statutes_url: https://www.njleg.state.nj.us
    notes: Among the slowest in the country.
  - state: PA
    name: Pennsylvania
    process: judicial
    statutes_url: https://www.legis.state.pa.us
    notes: Act 91 notice required.


# ─────────────────────────────────────────────────────────────────────────
# Excluded — demo funnel or firm-priced
#
# Recorded so the exclusion decision is visible and not silently revisited.
# ─────────────────────────────────────────────────────────────────────────
excluded:
  - name: CoCounsel Legal (Thomson Reuters)
    reason: Enterprise sales process; Westlaw-tier pricing.
  - name: Midpage Legal Research
    reason: Firm-priced, sales-led onboarding.
  - name: Lexis+ / Westlaw Edge
    reason: Contract sales only; no self-serve.
  - name: Bloomberg Law
    reason: Enterprise contract.
  - name: Jus Mundi
    reason: Arbitration focus; sales-led.
  - name: CoreLogic / Black Knight
    reason: Enterprise real estate data; demo required.
  - name: FactSet
    reason: Institutional financial data; enterprise only.
  - name: LegalZoom (MCP)
    reason: >-
      Paid attorney-consultation booking rather than a research source.
      Reachable at legalzoom.com/mcp/claude/v1 if wanted.


# ─────────────────────────────────────────────────────────────────────────
# Caveats that travel with this registry
# ─────────────────────────────────────────────────────────────────────────
caveats:
  - id: verify_before_relying
    text: >-
      Rate limits, free tiers and coverage change. Everything here was checked
      in July 2026; confirm current terms at the source.
  - id: not_legal_advice
    text: >-
      Free research is not legal advice. These tools make you a better-informed
      client; they do not replace a licensed attorney, and in a time-critical
      matter the attorney is the first priority.
  - id: consumer_vs_commercial
    text: >-
      Federal consumer-mortgage rules (TILA, RESPA, HMDA) generally do not
      reach business-purpose commercial loans. Reading a consumer-protection
      statute and assuming it applies to a commercial deed of trust is the most
      common self-research error.
  - id: as_of_date
    text: >-
      Licensing status, statutory text and regulations all change. What matters
      is usually the law and the licence as they stood on the closing date, not
      today.
